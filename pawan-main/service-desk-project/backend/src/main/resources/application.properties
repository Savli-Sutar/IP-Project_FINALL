spring.application.name=service-desk-backend
server.port=8080

# ==============================================================
# Database Configuration
# Default: H2 in-memory (starts instantly, no MySQL setup required)
# ==============================================================
spring.datasource.url=jdbc:h2:mem:service_ticket_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================================
# To use MySQL instead, uncomment the lines below and set your MySQL password:
# ==============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/service_ticket_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=satyam
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false
