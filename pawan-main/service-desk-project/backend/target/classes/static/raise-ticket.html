<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raise a Ticket · Helpdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="app-nav">
  <div class="app-nav__left">
    <div class="wordmark">
      <span class="wordmark__mark">HD</span>
      <span class="wordmark__text">Helpdesk</span>
    </div>
    <ul class="app-nav__links">
      <li><a href="raise-ticket.html" class="is-active">Raise Ticket</a></li>
      <li><a href="my-tickets.html">My Tickets</a></li>
      <li><a href="admin-dashboard.html">Admin Dashboard</a></li>
    </ul>
  </div>
  <div class="app-nav__user">
    <span class="user-chip" id="nav-user">Not signed in</span>
    <button class="app-nav__signout" id="nav-signout" type="button">Sign out</button>
  </div>
</nav>

<div class="page">
  <div class="page__head">
    <h1>Raise a ticket</h1>
    <p>Describe the issue and we'll route it to the right team.</p>
  </div>

  <div class="card">

    <p class="success-banner" id="success-banner"></p>

    <form id="ticket-form" novalidate>

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Short summary, e.g. Laptop not powering on" required>
        <p class="field__error" id="title-error"></p>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="What's happening? Include anything you've already tried."></textarea>
        <p class="field__error" id="description-error"></p>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Network">Network</option>
            <option value="Access">Account / Access</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>
          <p class="sla-preview" id="sla-preview"></p>
        </div>
      </div>

      <p class="form-note" id="form-note" role="alert"></p>

      <button type="submit" class="btn-primary">Submit ticket</button>
    </form>

  </div>
</div>

<script src="js/raise-ticket.js"></script>
</body>
</html>
